# 评价条目 C17 · 意外成本惊吓
# 归属：交易信任与风险（参考视角）；维护处：knowledge/criteria/
id: C17
name: 意外成本惊吓
version: 0.1
domain: { primary: D3 产品目标与用户行为, secondary: [D2 用户认知与体验] }
perspective: 信任与风险感知

applicable_context:
  page_types: [购物车页, 订单确认页, 支付方式页]
  user_tasks: [核对订单, 完成支付]
  user_states: [首次购物, 对价格敏感]

evaluation_goal: 附加成本在提交前被完整、尽早、无惊吓地披露

check_questions:
  - 运费 / 税费 / 手续费是否在最终提交前的每一步都可见并可预期？
  - 主按钮或订单摘要是否明确实付金额（如"支付 ¥xx"）？
  - 是否存在只在最后一步才出现的新条件（支付方式限制、融资条款、新增费用）？

judgment_rules:
  problem_if: 附加成本首次出现在最终确认步，或按钮金额与摘要金额不一致
  not_a_problem_if: 全程可计算总价，按钮标注实付金额
  severity_conditions:
    - 提交前一刻新增费用
    - 按钮金额与实付不符

sources:
  - source: "Baymard, 放弃原因数据（2026）"
    claim: "40% 因额外成本过高放弃；12% 因无法预先看到 / 计算总成本放弃"
    evidence_strength: E2（自述数据）
  - source: "Baymard, Payment UX"
    claim: "在最终确认前才披露支付限制等新信息，会造成意外与不信任"
    evidence_strength: E2

evidence_requirements:
  e1_minimum:
    - 各步骤费用信息呈现截图
    - 按钮文案与摘要金额对照
  cannot_conclude_without: 真实放弃行为数据

boundaries:
  - 与 C06 的分工：C06 评"能否核对"（信息呈现完整性），C17 评"是否被突然告知"（披露时机与预期管理）
  - 定价策略本身（运费高低）不在评审范围

output_contract: Issue-Record-Schema v0.1
validation_needs: [结算放弃点分布, 金额理解正确率, 意外成本相关的退出行为]
