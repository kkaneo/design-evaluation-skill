# 评价条目 C20 · 选择负担与比较成本
# 归属：决策负担（参考视角）；维护处：knowledge/criteria/
# 2026-11-03 增补真实产品案例（淘宝支付方式默认推荐）
id: C20
name: 选择负担与比较成本
version: 0.1
domain: { primary: D2 用户认知与体验 }
perspective: 决策负担

applicable_context:
  page_types: [优惠券选择, 支付方式页, 订单确认页]
  user_tasks: [选择优惠, 选择支付方式, 核对订单]
  user_states: [持有多个优惠, 无明确偏好, 默认项与自身条件不匹配]

evaluation_goal: 控制选项的比较成本，并保证默认不适配时的切换成本足够低

check_questions:
  - 同屏可选项（优惠券 / 支付方式 / 推荐项）有多少？关键差异能否一眼比较？
  - 是否提供默认项、分组或排序辅助？
  - 默认 / 优先推荐项与部分用户的实际条件不匹配时，切换到其他选项的入口是否同屏可得、路径是否足够短？
  - 用户是否需要逐个展开才能理解选项差异？

judgment_rules:
  problem_if: >
    同屏可选项多且无默认 / 分组 / 差异提示，比较需逐项展开（具体阈值待校准）；
    或默认项不适配时，切换需离开当前流程（退出支付页、进入二级设置）才能完成
  not_a_problem_if: >
    有合理默认 + 关键差异可见 + 可选展开详情；
    且默认不适配的用户能在同屏内发现并完成切换
  severity_conditions:
    - 选项间的差异信息自相矛盾或不可比
    - 切换路径中断流程且返回后状态丢失（与 C11 联动判定）

real_world_cases:
  - case: "淘宝支付方式默认推荐（项目组观察）"
    fact: >
      淘宝早期仅支持银行卡与支付宝；接入微信支付后，支付页仍优先推荐支付宝。
      仅在微信侧有资金的用户需暂时退出支付流程，寻找更换支付方式的入口
    analysis: >
      问题不在选项数量（支付方式齐全反而是必要条件），而在两点：
      ① 默认 / 优先推荐项与用户实际持有资源的适配；
      ② 切换入口的可达性——切换成本构成了实际的决策负担
    evidence_strength: E1（界面事实，可截图核查）+ E2（负担为推断，未经实测）
    verification: 待核实（需补当前版本截图确认入口路径）

sources:
  - source: "Iyengar & Lepper (2000), When Choice Is Demotivating, JPSP"
    claim: "选项数量过多会降低选择动机与满意度（经典选择过载实验）"
    evidence_strength: E2（经典实验研究，非电商结算情境直接验证）

evidence_requirements:
  e1_minimum: [选项列表截图, 每个选项可见的信息字段, 默认项与切换入口的位置]
  cannot_conclude_without: 选择行为数据（耗时 / 改选 / 放弃）

boundaries:
  - 选项数量的影响因用户专长与选项结构而异，不能机械套用阈值
  - 与"支付方式多样性"是两个维度：Baymard 数据显示支付方式不足导致 ~9–10% 放弃、多种方式提供容错——多样性解决"有没有"，本条目管"默认适配与切换成本"。淘宝案例证明两者可同时成立：方式齐全但默认不适配，仍是本条目的问题。表面张力是现成的关系判例
  - 默认项的商业选择（如优先推荐自家支付）是业务决策，本条目只评"不适配时的切换成本"

output_contract: Issue-Record-Schema v0.1
validation_needs: [选择耗时, 改选次数, 选择阶段放弃率, 非默认支付方式用户完成率]
